plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.android.gms.oss-licenses-plugin'
}

android {
    namespace "jp.cordea.urldispatcher"
    compileSdk 36

    defaultConfig {
        applicationId "jp.cordea.urldispatcher"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.1.0"
        testInstrumentationRunner "jp.cordea.urldispatcher.TestRunner"

        def licensesFile = file("licenses.yml")
        def ossLicenseCount = licensesFile.exists()
                ? licensesFile.readLines().count { it.startsWith("- artifact:") }
                : 0
        buildConfigField "int", "OSS_LICENSE_COUNT", "${ossLicenseCount}"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        dataBinding true
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "com.google.android.material:material:1.12.0"

    implementation "androidx.navigation:navigation-fragment-ktx:2.9.8"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.8"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    def koin_version = "2.0.1"
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-scope:$koin_version"
    implementation "io.insert-koin:koin-androidx-viewmodel:$koin_version"

    def groupie_version = "2.10.1"
    implementation "com.github.lisawray.groupie:groupie:$groupie_version"
    implementation "com.github.lisawray.groupie:groupie-kotlin-android-extensions:$groupie_version"
    implementation "com.github.lisawray.groupie:groupie-databinding:$groupie_version"

    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"

    implementation 'com.google.android.gms:play-services-oss-licenses:17.2.1'

    implementation "androidx.activity:activity-compose:1.13.0"
    implementation platform("androidx.compose:compose-bom:2026.06.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.12.1"
    testImplementation "io.mockk:mockk:1.13.10"
    testImplementation "com.google.truth:truth:1.4.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.5.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.5.1"
    androidTestImplementation "androidx.room:room-testing:2.8.4"
    androidTestImplementation "com.google.truth:truth:1.4.2"
    androidTestImplementation platform("androidx.compose:compose-bom:2026.06.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}
