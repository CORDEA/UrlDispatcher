plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.android.gms.oss-licenses-plugin'
}

android {
    namespace "jp.cordea.urldispatcher"
    compileSdk 37

    defaultConfig {
        applicationId "jp.cordea.urldispatcher"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "jp.cordea.urldispatcher.TestRunner"
    }
    signingConfigs {
        release {
            storeFile rootProject.file("release.keystore")
            storePassword findProperty("storePassword")
            keyAlias findProperty("keyAlias")
            keyPassword findProperty("keyPassword")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "com.google.android.material:material:1.12.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    def koin_version = "3.5.6"
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-compose:$koin_version"

    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"

    implementation 'com.google.android.gms:play-services-oss-licenses:17.2.1'

    implementation "androidx.activity:activity-compose:1.13.0"
    implementation platform("androidx.compose:compose-bom:2026.06.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.12.1"
    testImplementation "io.mockk:mockk:1.13.10"
    testImplementation "com.google.truth:truth:1.4.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.room:room-testing:2.8.4"
    androidTestImplementation "com.google.truth:truth:1.4.2"
    androidTestImplementation platform("androidx.compose:compose-bom:2026.06.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}
